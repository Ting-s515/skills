<form class="profile-form" aria-label="Profile form">
  <label class="name-label" for="displayName">Display name</label>
  <input
    id="displayName"
    class="name-input"
    type="text"
    autocomplete="name"
    style="width: 240px;"
  >
  <button class="save-button" type="submit">Save</button>
</form>
